name: Build & Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Hardened Release APK
        run: ./gradlew assembleRelease --no-daemon --no-configuration-cache --stacktrace

      - name: Find APK path
        id: apk
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find app/build/outputs/apk -name "*.apk" | head -1)
          fi
          echo "Found APK: $APK_PATH"
          echo "path=$APK_PATH" >> $GITHUB_OUTPUT
          echo "filename=$(basename $APK_PATH)" >> $GITHUB_OUTPUT

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: ${{ steps.apk.outputs.path }}
          retention-days: 30

      - name: Generate Release Notes
        id: notes
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            NOTES=$(git log --pretty=format:"- %s" "$PREV_TAG..HEAD" | head -20)
          else
            NOTES=$(git log --pretty=format:"- %s" -20)
          fi
          if [ -z "$NOTES" ]; then
            NOTES="- System performance and security improvements"
          fi
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release with APK
        id: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Release v1.0.${{ github.run_number }}"
          body: |
            ## 3D Ledger — Update v1.0.${{ github.run_number }}
            ဤဗားရှင်းတွင် ပါဝင်သော အပြောင်းအလဲများ (What's Changed):
            ${{ steps.notes.outputs.notes }}

            ---
            APK ကို ဒေါင်းလုဒ်ဆွဲ၍ တပ်ဆင်နိုင်ပါသည် (R8 obfuscation + anti-reverse-engineering shield)။
          files: ${{ steps.apk.outputs.path }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get GitHub Release URL
        id: release_url
        run: |
          RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/v1.0.${{ github.run_number }}"
          echo "url=$RELEASE_URL" >> $GITHUB_OUTPUT

      - name: Sync Release to Telegram Bot & Cloudflare Worker
        env:
          NOTES: ${{ steps.notes.outputs.notes }}
        run: |
          RELEASE_TAG="v1.0.${{ github.run_number }}"
          FILE_NAME="${{ steps.apk.outputs.filename }}"
          DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/${RELEASE_TAG}/${FILE_NAME}"
          RELEASE_URL="${{ steps.release_url.outputs.url }}"
          NOTES_FILE=$(mktemp)
          printf '%s' "$NOTES" > "$NOTES_FILE"
          echo "Syncing ${RELEASE_TAG} (${DOWNLOAD_URL}) to Cloudflare Worker..."
          curl -s -X POST "https://3d-scraper-worker.khaingkhantkyaw001.workers.dev/api/app/publish" \
            -H "Content-Type: application/json" \
            --data-binary @- <<EOF_PAYLOAD
          {
            "version_name": "${RELEASE_TAG}",
            "version_code": ${{ github.run_number }},
            "file_name": "${FILE_NAME}",
            "download_url": "${DOWNLOAD_URL}",
            "release_url": "${RELEASE_URL}",
            "release_notes": $(python3 -c "import json,sys; print(json.dumps(open(sys.argv[1]).read().strip()))" "$NOTES_FILE"),
            "uploaded_by": "GitHub Actions",
            "broadcast": true
          }
          EOF_PAYLOAD
