name: Build & Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Hardened Release APK
        run: ./gradlew assembleRelease --no-daemon --no-configuration-cache --stacktrace

      - name: Find APK path
        id: apk
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find app/build/outputs/apk -name "*.apk" | head -1)
          fi
          echo "Found APK: $APK_PATH"
          echo "path=$APK_PATH" >> $GITHUB_OUTPUT
          echo "filename=$(basename $APK_PATH)" >> $GITHUB_OUTPUT

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: ${{ steps.apk.outputs.path }}
          retention-days: 30

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "Release v1.0.${{ github.run_number }}"
          body: "Automated production release from commit ${{ github.sha }} with R8 bytecode obfuscation and anti-reverse engineering shield."
          files: ${{ steps.apk.outputs.path }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync Release to Telegram Bot & Cloudflare Worker
        run: |
          RELEASE_TAG="v1.0.${{ github.run_number }}"
          FILE_NAME="${{ steps.apk.outputs.filename }}"
          DOWNLOAD_URL="https://github.com/sayarkhant001/3d_Agent/releases/download/${RELEASE_TAG}/${FILE_NAME}"
          echo "Syncing ${RELEASE_TAG} (${DOWNLOAD_URL}) to Cloudflare Worker..."
          curl -s -X POST "https://3d-scraper-worker.khaingkhantkyaw001.workers.dev/api/app/publish" \
            -H "Content-Type: application/json" \
            -d '{
              "version_name": "'"${RELEASE_TAG}"'",
              "version_code": '${{ github.run_number }}',
              "file_name": "'"${FILE_NAME}"'",
              "download_url": "'"${DOWNLOAD_URL}"'",
              "release_notes": "Automated release from GitHub Actions run #${{ github.run_number }}",
              "uploaded_by": "GitHub Actions",
              "broadcast": true
            }'
