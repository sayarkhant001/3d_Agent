name: Build & Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Write google-services.json
        run: echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > app/google-services.json

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --no-configuration-cache

      - name: Dump KSP generated files on failure
        if: failure()
        run: |
          echo "=== BluetoothPrinter.kt lines 325-335 ==="
          sed -n '325,335p' app/src/main/java/com/threeDLedger/logic/BluetoothPrinter.kt | cat -A
          echo "=== KSP generated Kotlin files ==="
          find app/build/generated/ksp -name "*.kt" 2>/dev/null | head -20
          echo "=== First 30 lines of each generated file ==="
          find app/build/generated/ksp -name "*.kt" 2>/dev/null | while read f; do
            echo "--- $f ---"
            head -30 "$f" | cat -A
          done

      - name: Find APK path
        id: apk
        if: success()
        run: |
          APK_PATH=$(find app/build/outputs/apk -name "*.apk" | head -1)
          echo "Found APK: $APK_PATH"
          echo "path=$APK_PATH" >> $GITHUB_OUTPUT

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: ${{ steps.apk.outputs.path }}
          retention-days: 30

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        if: github.ref == 'refs/heads/main' && success()
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "v1.0.${{ github.run_number }}"
          body: "Auto-build from commit ${{ github.sha }}"
          files: ${{ steps.apk.outputs.path }}
          token: ${{ secrets.GITHUB_TOKEN }}
